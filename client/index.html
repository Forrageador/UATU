<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Kurioso</title>
  </head>
  <body>
    <div id="app">
      <div id="participants-grid"></div>

      <div id="bottom-bar">
        <button id="broadcast-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="vertical-align:middle;margin-right:6px;">
            <path d="M1 7L5 11C7.76 8.24 11.72 8.24 14.49 11L18.49 7C14.21 2.72 7.79 2.72 3.51 7H1ZM8 14L12 18L16 14C14.01 12.01 9.99 12.01 8 14ZM12 22C13.1 22 14 21.1 14 20H10C10 21.1 10.9 22 12 22Z"/>
          </svg>
          Transmitir tela
        </button>
      </div>

      <div id="fullscreen-overlay" class="hidden">
        <video id="fullscreen-video" autoplay playsinline></video>

        <div id="fullscreen-controls">
          <span id="fullscreen-label"></span>

          <div class="volume-control">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
            </svg>
            <input type="range" id="fullscreen-volume-slider" min="0" max="100" value="100" />
          </div>

          <button id="fullscreen-exit-btn" title="Sair de tela cheia">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
            </svg>
            Sair
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
